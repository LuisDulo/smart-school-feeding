name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and security scans
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feeding
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only values. Nothing here is a real secret.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      DB_NAME: feeding
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit bandit
      - name: Django system checks
        run: python manage.py check
      - name: Tests
        run: python -m pytest -q
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: Static analysis (bandit, medium and high)
        run: bandit -q -r accounts anomalies core forecasting meals payments -x '*/migrations/*' -ll

  frontend:
    name: ${{ matrix.app }} dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fails on critical issues in anything installed for production. The
      # dashboard's remaining high issues are in react-scripts build tooling,
      # which never ships to users (see the security review report).
      - name: npm audit
        run: npm audit --omit=dev --audit-level=critical
